onboarding = false

[keys]
prefix = "ctrl+t"

# Navigate mode (prefix+w): move workspace selection with j/k
navigate_workspace_up = "k"
navigate_workspace_down = "j"
# Default pane up/down in navigate mode is k/j; move them off to avoid the conflict
navigate_pane_up = "ctrl+k"
navigate_pane_down = "ctrl+j"
